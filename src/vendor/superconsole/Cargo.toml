[package]
name = "superconsole_ffi"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "C FFI bindings for Meta's superconsole TUI library"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Meta's superconsole
superconsole = "0.2"

# Error handling
anyhow = "1.0"

# FFI helpers
libc = "0.2"

# Thread-safe state management
parking_lot = "0.12"

[build-dependencies]
cbindgen = "0.28"
