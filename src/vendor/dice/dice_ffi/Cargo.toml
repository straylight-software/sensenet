[package]
name = "dice_ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "C FFI bindings for DICE incremental computation engine"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# DICE dependencies from workspace
allocative.workspace = true
dupe.workspace = true
dice.workspace = true
dice_futures.workspace = true
dice_error.workspace = true

# Async runtime
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true

# FFI helpers
libc = "0.2"

# Crypto for content-addressing
sha2 = "0.10"
hex = "0.4"

[build-dependencies]
cbindgen = "0.28"
