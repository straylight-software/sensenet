# cbindgen configuration for dice-ffi

[defines]

[export]
include = []
exclude = []

[layout]
# Use C-compatible layout
aligned_n = ""

[fn]
# Document function safety
must_use = "DICE_MUST_USE"
# Prefix functions
prefix = ""
# Generate documentation
sort_by = "Name"

[struct]
# Document struct fields
associated_constants_in_body = false
# Generate documentation  
derive_helper_methods = false

[enum]
# Use simple integers for enums
derive_helper_methods = false
# Prefix enum variants
prefix_with_name = true

[documentation]
# Generate documentation comments
style = "doxy"

[parse]
# Parse dependencies
parse_deps = false
# Include certain patterns
include = []

[parse.expand]
# Expand certain crates
crates = []
